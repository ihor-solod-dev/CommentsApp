version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  main-api:
    build:
      context: ./main-api
      dockerfile: Dockerfile
    restart: on-failure
    command: npm run start:dev
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${MAIN_API_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_ACCESS_PRIVATE_KEY: ${JWT_ACCESS_PRIVATE_KEY}
      JWT_ACCESS_PUBLIC_KEY: ${JWT_ACCESS_PUBLIC_KEY}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      FILES_SERVICE_URL: http://files-service:${FILES_SERVICE_PORT}
      FILES_SERVICE_SECRET: ${FILES_SERVICE_SECRET}
      AI_TRANSLATOR_URL: http://ai-translator:${AI_TRANSLATOR_PORT}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      MAIN_API_INTERNAL_SECRET: ${MAIN_API_INTERNAL_SECRET}
    ports:
      - "${MAIN_API_PORT}:${MAIN_API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./main-api:/app
      - /app/node_modules

  files-service:
    build:
      context: ./files-service
      dockerfile: Dockerfile
    command: npm run start:dev
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${FILES_SERVICE_PORT}
      FILES_SERVICE_SECRET: ${FILES_SERVICE_SECRET}
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /uploads
    ports:
      - "${FILES_SERVICE_PORT}:${FILES_SERVICE_PORT}"
    volumes:
      - files_data:/uploads
      - ./files-service:/app
      - /app/node_modules

  ai-translator:
    build:
      context: ./ai-translator
      dockerfile: Dockerfile
    command: npm run start:dev
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AI_TRANSLATOR_PORT}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
    ports:
      - "${AI_TRANSLATOR_PORT}:${AI_TRANSLATOR_PORT}"
    volumes:
      - ./ai-translator:/app
      - /app/node_modules

  email-distribution:
    build:
      context: ./email-distribution
      dockerfile: Dockerfile
    restart: on-failure
    command: npm run start:dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MAIN_API_URL: http://main-api:${MAIN_API_PORT}
      MAIN_API_INTERNAL_SECRET: ${MAIN_API_INTERNAL_SECRET}
      BATCH_SIZE: ${EMAIL_BATCH_SIZE}
      BATCH_DELAY_MS: ${EMAIL_BATCH_DELAY_MS}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./email-distribution:/app
      - /app/node_modules

  smtp-service:
    build:
      context: ./smtp-service
      dockerfile: Dockerfile
    restart: on-failure
    command: npm run start:dev
    environment:
      NODE_ENV: ${NODE_ENV}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./smtp-service:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${MAIN_API_PORT}
        VITE_FILES_URL: http://localhost:${FILES_SERVICE_PORT}
        VITE_WS_URL: ws://localhost:${MAIN_API_PORT}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - main-api

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  files_data:
