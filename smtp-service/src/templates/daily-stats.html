<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 32px;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .date {
            color: #888;
            margin-bottom: 24px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .stat-label {
            color: #555;
        }

        .stat-value {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">Привіт, {{username}}!</div>
        <div class="date">Статистика за {{date}}</div>
        <div class="stat">
            <span class="stat-label">Всього коментарів</span>
            <span class="stat-value">{{totalComments}}</span>
        </div>
        <div class="stat">
            <span class="stat-label">Загальний рейтинг</span>
            <span class="stat-value">{{totalScore}}</span>
        </div>
    </div>
</body>

</html>
